{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payout Saga Ops</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/static/htmx.min.js"></script>
<style>
:root { --bg:#f6f7f9; --card:#fff; --ink:#1b2430; --mute:#667085; --line:#e4e7ec; --brand:#2447d6; }
* { box-sizing: border-box; }
body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
header { background:#111827; color:#fff; padding:0 24px; display:flex; align-items:center; gap:28px; height:52px; }
header b { font-size:15px; letter-spacing:.2px; }
header nav a { color:#c7cfdb; text-decoration:none; margin-right:18px; padding:16px 0; display:inline-block; }
header nav a.on { color:#fff; border-bottom:2px solid #7aa2ff; }
main { max-width:1180px; margin:24px auto; padding:0 24px; }
h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:15px; margin:24px 0 8px; }
p.sub { color:var(--mute); margin:0 0 16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
th { background:#f0f2f6; font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--mute); }
tr:last-child td { border-bottom:0; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
code, .mono { font-family:ui-monospace,Consolas,monospace; font-size:12.5px; }
a { color:var(--brand); }
.chip { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }
.chip.succeeded,.chip.ok,.chip.settled { background:#dcfce7; color:#166534; }
.chip.compensated { background:#fee2e2; color:#991b1b; }
.chip.processing,.chip.started { background:#dbeafe; color:#1e40af; }
.chip.pending { background:#e5e7eb; color:#374151; }
.chip.error { background:#fef3c7; color:#92400e; }
.chip.replayed { background:#ede9fe; color:#5b21b6; }
.chip.needs_review,.chip.bad,.chip.lost { background:#fecaca; color:#7f1d1d; }
.stats { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 16px; min-width:120px; }
.stat b { display:block; font-size:22px; }
.bar { background:#e5e7eb; border-radius:4px; height:8px; width:160px; } .bar i { display:block; background:#4f6ef2; height:8px; border-radius:4px; }
button, .btn { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:8px 14px; font:inherit; cursor:pointer; }
button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
form.inline { display:inline; }
.grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
label { display:block; margin:10px 0 2px; color:var(--mute); font-size:12px; }
input[type=range] { width:100%; } output { font-weight:600; }
.pre { background:#0f172a; color:#d1fae5; padding:10px 12px; border-radius:8px; overflow:auto; font-size:12px; }
.verdict { font-size:16px; font-weight:700; }
</style>
</head>
<body>
<header><b>Payout Saga Ops</b>
<nav>
<a href="/" class="{{if eq .Nav "payouts"}}on{{end}}">Payouts</a>
<a href="/inject" class="{{if eq .Nav "inject"}}on{{end}}">Failure injection</a>
<a href="/recon" class="{{if eq .Nav "recon"}}on{{end}}">Reconciliation</a>
<a href="/invariants" class="{{if eq .Nav "invariants"}}on{{end}}">Invariants</a>
</nav></header>
<main>
{{end}}
{{define "foot"}}</main></body></html>{{end}}
