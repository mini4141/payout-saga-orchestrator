name: payout-saga

x-app-env: &app-env
  DATABASE_URL: postgres://payout:${POSTGRES_PASSWORD:-payout}@postgres:5432/payout?sslmode=disable
  TEMPORAL_ADDRESS: temporal:7233
  MOCKS_URL: http://mocks:8090
  RECEIVER_URL: http://receiver:8095/events
  API_TOKEN: ${API_TOKEN:-dev-token}
  OTEL_TRACES_STDOUT: ${OTEL_TRACES_STDOUT:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-app: &app
  image: payout-saga:local
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: payout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payout}
      POSTGRES_DB: payout
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payout -d payout"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Temporal dev server (in-memory/SQLite). Production would use a persistent cluster or Temporal Cloud.
  temporal:
    image: temporalio/temporal:1.10.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--port", "7233", "--ui-port", "8233"]
    ports: ["17233:7233", "18233:8233"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 30

  migrate:
    <<: *app
    build: . # the one image build; every other service reuses payout-saga:local
    command: ["migrate", "up", "seed"]
    restart: "no"
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }

  mocks:
    <<: *app
    command: ["mocks"]
    environment: *app-env
    ports: ["18090:8090"]

  receiver:
    <<: *app
    command: ["receiver"]
    environment: *app-env
    ports: ["18095:8095"]

  api:
    <<: *app
    command: ["api"]
    environment: *app-env
    ports: ["18080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }

  worker:
    <<: *app
    command: ["worker"]
    restart: "no" # drills kill and restart it explicitly
    environment: *app-env
    ports: ["19090:9090"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }
      mocks: { condition: service_started }

  relay:
    <<: *app
    command: ["relay"]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      receiver: { condition: service_started }

  ops-ui:
    <<: *app
    command: ["ops-ui"]
    environment:
      <<: *app-env
      API_URL: http://api:8080
      TEMPORAL_UI_URL: http://localhost:18233
    ports: ["18081:8081"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }
      api: { condition: service_started }
